<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Генератор иконок — Go Roadmap</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; padding: 32px 20px; background: #f7f1e6; color: #2e2921;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { width: min(720px, 100%); margin: 0 auto; }
    h1 { letter-spacing: -.03em; }
    p { color: #5d5446; line-height: 1.6; }
    .previews { display: flex; flex-wrap: wrap; gap: 22px; align-items: end; margin: 28px 0; }
    .preview { display: grid; gap: 10px; justify-items: center; }
    .preview img { display: block; max-width: 100%; height: auto; border-radius: 22%; box-shadow: 0 12px 28px rgba(8, 96, 92, .24); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    a {
      display: inline-flex; align-items: center; min-height: 46px; padding: 10px 18px;
      border-radius: 12px; background: #0f9488; color: #fff; font-weight: 700;
      text-decoration: none;
    }
    code { background: #e0f4f0; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>Иконки PWA</h1>
    <p>Страница рисует иконки на canvas и сразу предлагает скачать PNG. После замены файлов увеличьте версию кэша в <code>sw.js</code>.</p>
    <div class="previews" id="previews"></div>
    <div class="actions" id="actions"></div>
  </main>
  <script>
    "use strict";
    const sizes = [192, 512];
    const previews = document.getElementById("previews");
    const actions = document.getElementById("actions");

    function drawIcon(size) {
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");

      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, "#19a99b");
      gradient.addColorStop(0.55, "#0f867c");
      gradient.addColorStop(1, "#0a5f59");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);

      const glow = ctx.createRadialGradient(size * 0.86, size * 0.9, 0, size * 0.86, size * 0.9, size * 0.55);
      glow.addColorStop(0, "rgba(255, 214, 160, 0.35)");
      glow.addColorStop(1, "rgba(255, 214, 160, 0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, size, size);

      ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
      ctx.lineWidth = size * 0.06;
      ctx.beginPath();
      ctx.arc(size * 0.86, size * 0.14, size * 0.34, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "800 " + Math.round(size * 0.44) + "px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.fillText("Go", size / 2, size / 2 + size * 0.02);
      return canvas;
    }

    sizes.forEach((size) => {
      const canvas = drawIcon(size);
      const url = canvas.toDataURL("image/png");
      const preview = document.createElement("div");
      preview.className = "preview";
      preview.innerHTML = '<img src="' + url + '" width="' + size + '" height="' + size + '" alt="Иконка ' + size + ' px">' +
        '<span>icon-' + size + '.png</span>';
      previews.appendChild(preview);

      const link = document.createElement("a");
      link.href = url;
      link.download = "icon-" + size + ".png";
      link.textContent = "Скачать " + size + " px";
      actions.appendChild(link);
    });
  </script>
</body>
</html>
